# Optional Home Assistant package for LILYGO T3-S3 Flipper 868 Gateway.
# Replace lilygo-868.local with a reserved IP if mDNS is unavailable.

rest_command:
  lilygo_868_send_slot:
    url: >-
      http://lilygo-868.local/api/send?slot={{ slot | int }}&repeats={{ repeats | default(1) | int }}&gap_ms={{ gap_ms | default(100) | int }}
    method: post
    authentication: digest
    username: !secret lilygo_868_username
    password: !secret lilygo_868_password
    timeout: 10

switch:
  - platform: rest
    name: LILYGO 868 OLED
    resource: http://lilygo-868.local/api/display
    state_resource: http://lilygo-868.local/api/status
    method: post
    username: !secret lilygo_868_username
    password: !secret lilygo_868_password
    body_on: enabled=1
    body_off: enabled=0
    is_on_template: "{{ value_json.display | bool }}"
    headers:
      Content-Type: application/x-www-form-urlencoded
    icon: mdi:monitor
    timeout: 10

template:
  - button:
      - name: LILYGO 868 Slot 0
        unique_id: lilygo_868_slot_00
        icon: mdi:radio-tower
        press:
          - action: rest_command.lilygo_868_send_slot
            data: {slot: 0, repeats: 1, gap_ms: 100}
      - name: LILYGO 868 Slot 1
        unique_id: lilygo_868_slot_01
        icon: mdi:radio-tower
        press:
          - action: rest_command.lilygo_868_send_slot
